{% extends "social/base.html" %}

{% block extra_css %}
<style>
    body {
        background: #111;
        margin: 0;
    }

    .story-viewer {
        max-width: 430px;
        height: 75vh;
        min-height: 450px;
        margin: 20px auto;
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .story-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* Progress bar */
    .story-progress {
        position: absolute;
        top: 10px;
        left: 12px;
        right: 12px;
        height: 4px;
        background: rgba(255, 255, 255, 0.35);
        border-radius: 10px;
        z-index: 5;
        overflow: hidden;
    }

    .story-progress-fill {
        height: 100%;
        width: 0%;
        background: white;
        border-radius: 10px;
        animation: storyTimer 5s linear forwards;
    }

    @keyframes storyTimer {
        from {
            width: 0%;
        }

        to {
            width: 100%;
        }
    }

    .story-header {
        position: absolute;
        top: 25px;
        left: 15px;
        right: 15px;
        color: white;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-shadow: 0 1px 4px black;
    }

    .story-username {
        font-size: 16px;
        font-weight: bold;
    }

    .story-time {
        font-size: 12px;
        margin-left: 8px;
    }

    .story-close {
        color: white;
        text-decoration: none;
        font-size: 28px;
    }

    .story-navigation {
        position: absolute;
        top: 50%;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        transform: translateY(-50%);
        z-index: 3;
    }

    .story-navigation a {
        color: white;
        background: rgba(0, 0, 0, 0.45);
        text-decoration: none;
        font-size: 25px;
        padding: 8px 13px;
        border-radius: 50%;
    }

    .story-footer {
        position: absolute;
        bottom: 15px;
        left: 15px;
        right: 15px;
        color: white;
        text-align: center;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .story-viewer {
            width: 100%;
            height: 75vh;
            min-height: 400px;
            margin: 10px auto;
            border-radius: 0;
        }
    }
</style>
{% endblock %}

{% block content %}

<div class="story-viewer">

    <!-- Progress bar -->
    <div class="story-progress">
        <div class="story-progress-fill"></div>
    </div>

    <img src="{{ story.image.url }}" class="story-image" alt="Story">

    <div class="story-header">
        <div>
            <span class="story-username">
                {{ story.author.username }}
            </span>

            <span class="story-time">
                {{ story.created_at|timesince }} ago
            </span>
        </div>

        <a href="{% url 'home' %}" class="story-close">
            &times;
        </a>
    </div>

    <div class="story-navigation">

        {% if previous_story %}
        <a href="{% url 'view_story' previous_story.id %}">
            &#10094;
        </a>
        {% else %}
        <span></span>
        {% endif %}

        {% if next_story %}
        <a href="{% url 'view_story' next_story.id %}">
            &#10095;
        </a>
        {% endif %}

    </div>

    <div class="story-footer">
        Shrinsta Stories
    </div>

</div>

<script>
    // Automatically move to the next story after 5 seconds
    setTimeout(function () {
        {% if next_story %}
        window.location.href = "{% url 'view_story' next_story.id %}";
        {% else %}
        window.location.href = "{% url 'home' %}";
        {% endif %}
    }, 5000);
</script>

{% endblock %}
